<!DOCTYPE html>
<html lang="ru">
<head>

<title>404 — уровень не найден</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:#0a0d1a;color:#e8ecf6;text-align:center;
    font-family:'Rubik','Segoe UI',system-ui,sans-serif;
    background-image:linear-gradient(rgba(90,110,180,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(90,110,180,.05) 1px,transparent 1px);background-size:44px 44px}
  .code{font-size:clamp(70px,20vw,140px);font-weight:900;color:#fff;letter-spacing:.04em;
    text-shadow:0 0 24px rgba(255,77,141,.7)}
  .t{font-family:'JetBrains Mono',Consolas,monospace;letter-spacing:.3em;color:#ff4d8d;font-size:13px}
  p{max-width:400px;line-height:1.6;color:#8f9ab8;margin:0 16px}
  a{display:inline-block;margin-top:10px;padding:13px 26px;border-radius:12px;color:#061018;
    background:linear-gradient(90deg,#4de3e3,#9ff0f0);font-weight:700;text-decoration:none;
    font-family:'JetBrains Mono',Consolas,monospace;letter-spacing:.1em;font-size:13px;
    box-shadow:0 0 22px rgba(77,227,227,.35)}
  a:hover{box-shadow:0 0 30px rgba(77,227,227,.6)}
</style>
</head>
<body>
  <div class="t">MISSING NO · СТРАНИЦА ПРОВАЛИЛАСЬ В ПОЛЫНЬЮ</div>
  <div class="code">404</div>
  <p>Такого уровня в этом мире нет. Возможно, решатель ещё не доказал его проходимость.</p>
  <a href="/">◀ В ГЛАВНОЕ МЕНЮ</a>
  <script>
    /* если пришли за игрой, которой нет — подскажем в консоли */
    if (location.pathname.indexOf("/play/") === 0)
      console.info("Сборка этой игры ещё не выложена: web_games_pipeline.ps1 → publish_site.ps1");
  </script>
</body>
</html>
